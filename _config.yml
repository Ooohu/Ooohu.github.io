# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Keng Lin

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  How To: 
    - Git: "notes/command_git"
    - ROOT: "notes/command_root"
    - UNIX: "notes/command_terminal"
    - Mathematica: "notes/command_math"
  Nu Detector: "https://ooohu.github.io/NeutrinoExperimentsOnEarth/"
  Nu Detector: "notes/nu-detector"


################
# --- Logo --- #
################

# Image to show in the navigation bar - works best with a square image
# Remove this parameter if you don't want an image in the navbar
avatar: "/assets/img/me.jpeg"

# By default, the image is cut into a circle. You can disable this behaviour by setting 'round-avatar: false'
round-avatar: true

# If you want to have an image logo in the top-left corner instead of having the title of the website,
# then specify the following parameter
#title-img: /path/to/image


#email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  A page with my miscellaneous notes! Currently I am collecting coordinates of
  neutrino experiments:
  [NeutrinoExperimentsOnEarth](https://ooohu.github.io/NeutrinoExperimentsOnEarth/)
#  line in _config.yml. It will appear in your document head meta (for
#  Google search results) and in your feed.xml site description.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#####################################
# --- Footer social media links --- #
#####################################

# Select the social network links that you want to show in the footer.
# You can change the order that they show up on the page by changing the order here.
# Uncomment the links you want to show and add your information to each one.
social-network-links:
  github:  Ooohu
  linkedin: keng-lin-a864b198
  ORCID: 0000-0003-4442-8554
  google-scholar: 8zLy91EAAAAJ
  email: "keng.lin@rutgers.edu"
  rss: false


# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-remote-theme

